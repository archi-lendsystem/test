
name: Deploy Development

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.DEV_SERVER_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SERVER_KNOWN_HOSTS }}
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          test -n "$SSH_PRIVATE_KEY"
          test -n "$SERVER_HOST"
          test -n "$SSH_KNOWN_HOSTS"

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Connect to server and run deployment
        env:
          SERVER_HOST: ${{ secrets.DEV_SERVER_HOST }}
        run: |
          set -eu

          ssh \
            -i ~/.ssh/deploy_key \
            -p 22 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "ubuntu@$SERVER_HOST" \
            'bash "$HOME/apps/my-project-dev/deploy-dev.sh"'
