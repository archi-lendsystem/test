
name: Deploy Development

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Configure SSH
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SERVER_KNOWN_HOSTS }}
          SERVER_HOST: ${{ secrets.DEV_SERVER_HOST }}
        run: |
          set -eu

          echo "Configuring SSH..."

          # Check required secrets
          test -n "$SSH_PRIVATE_KEY" || {
            echo "ERROR: SSH private key is missing"
            exit 1
          }

          test -n "$SSH_KNOWN_HOSTS" || {
            echo "ERROR: SSH known hosts is missing"
            exit 1
          }

          test -n "$SERVER_HOST" || {
            echo "ERROR: Server host is missing"
            exit 1
          }

          # Create SSH directory
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Save SSH private key
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Configure trusted SSH hosts
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "SSH configuration completed"

      # Step 2: Validate SSH private key
      - name: Validate SSH private key
        run: |
          set -eu

          echo "Validating SSH private key..."

          ssh-keygen -y -P "" \
            -f ~/.ssh/deploy_key \
            > /dev/null || {
              echo "ERROR: Invalid, unreadable, or encrypted SSH private key"
              exit 1
            }

          echo "SSH private key validation successful"

      # Step 3: Connect and deploy
      - name: Connect to server and run deployment
        env:
          SERVER_HOST: ${{ secrets.DEV_SERVER_HOST }}
        run: |
          set -eu

          echo "Connecting to development server..."

          test -n "$SERVER_HOST"

          ssh \
            -i ~/.ssh/deploy_key \
            -p 22 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "ubuntu@$SERVER_HOST" \
            'bash "$HOME/apps/my-project-dev/deploy-dev.sh"'

          echo "Deployment completed successfully"
