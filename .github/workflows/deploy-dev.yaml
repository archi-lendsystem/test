
name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      bootstrap_staging:
        description: 'First-time setup (no migrations)'
        type: boolean
        required: true
        default: false

      bootstrap_confirmation:
        description: 'Type Confirm to confirm'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-staging
  cancel-in-progress: false

jobs:
  tests:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: pdo_sqlite, sqlite3

      - name: Validate and run tests
        shell: bash
        run: |
          set -euo pipefail

          bash -n scripts/deploy.sh

          composer validate --no-check-publish

          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress

          composer check-platform-reqs

          test -d tests

          find tests -type f -name '*Test.php' \
            -print -quit | grep -q .

          # Isolated test environment, no staging credentials.
          cat > .env <<'ENV'
          APP_NAME=Laravel
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          DB_CONNECTION=sqlite
          DB_DATABASE=:memory:
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          ENV

          php artisan key:generate --force

          php artisan test --stop-on-failure

  deploy:
    name: Deploying backend code to staging

    if: github.ref == 'refs/heads/staging'
    needs: tests
    environment: staging

    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    env:
      LOCAL_ENV_PATH: ${{ secrets.LOCAL_ENV_PATH }}
      REMOTE_DEPLOY_DIR: ${{ secrets.REMOTE_DEPLOY_DIR }}
      REMOTE_WEB_ROOT: ${{ secrets.REMOTE_WEB_ROOT }}
      BACKEND_URL: ${{ secrets.BACKEND_URL }}

      EXPECTED_DB_HOST: ${{ secrets.EXPECTED_DB_HOST }}
      EXPECTED_DB_DATABASE: ${{ secrets.EXPECTED_DB_DATABASE }}

      HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}

      COMMIT_SHA: ${{ github.sha }}
      BOOTSTRAP_REQUESTED: ${{ inputs.bootstrap_staging }}
      BOOTSTRAP_CONFIRMATION: ${{ inputs.bootstrap_confirmation }}

    steps:
      # ======================================================
      # 1. Checkout repository
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      # Each workflow rerun must have new release and snapshot paths.
      # Preserve 40-character hexadecimal format expected by deploy.sh.
      - name: Generate unique deployment release ID
        run: |
          set -euo pipefail
          RELEASE_ID="$(
            printf '%s' "${GITHUB_SHA}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
              | shasum -a 256 | cut -c1-40
          )"
          [[ "$RELEASE_ID" =~ ^[0-9a-f]{40}$ ]]
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "Deployment attempt release ID: $RELEASE_ID"

      # ======================================================
      # 2. Validate staging environment before deployment
      # ======================================================

      - name: Validate staging configuration and environment file
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF" == 'refs/heads/staging' ]]

          : "${LOCAL_ENV_PATH:?Missing LOCAL_ENV_PATH}"
          : "${REMOTE_DEPLOY_DIR:?Missing REMOTE_DEPLOY_DIR}"
          : "${BACKEND_URL:?Missing BACKEND_URL}"
          : "${EXPECTED_DB_HOST:?Missing EXPECTED_DB_HOST}"
          : "${EXPECTED_DB_DATABASE:?Missing EXPECTED_DB_DATABASE}"
          : "${HEALTH_CHECK_TOKEN:?Missing HEALTH_CHECK_TOKEN}"

          [[ -f "$LOCAL_ENV_PATH" &&
             -s "$LOCAL_ENV_PATH" &&
             -r "$LOCAL_ENV_PATH" ]]

          [[ "$REMOTE_DEPLOY_DIR" =~ ^[A-Za-z0-9_-]+$ ]]

          [[ "${REMOTE_WEB_ROOT:-public_html}" =~ ^[A-Za-z0-9_][A-Za-z0-9_/-]*$ ]]
          [[ "${REMOTE_WEB_ROOT:-public_html}" != *..* ]]

          [[ "$BACKEND_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]]

          [[ "$EXPECTED_DB_HOST" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$EXPECTED_DB_DATABASE" =~ ^[A-Za-z0-9_-]+$ ]]

          [[ -z "${SMOKE_TEST_PATH:-}" ||
             "$SMOKE_TEST_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]

          [[ "${SMOKE_TEST_PATH:-}" != *..* ]]

          # Optional whitespace-separated, read-only endpoints for deeper smoke tests.
          # Keep existing SMOKE_TEST_PATH support unchanged.
          for path in ${SMOKE_TEST_PATHS:-}; do
            [[ "$path" =~ ^/[A-Za-z0-9_./-]+$ && "$path" != *..* ]] || {
              echo '::error::Invalid SMOKE_TEST_PATHS entry'
              exit 1
            }
          done

          bash -n scripts/deploy.sh

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo '::error::.env is tracked by Git'
            exit 1
          fi

          # Validate without displaying secrets.

          grep -Eq '^APP_ENV=staging\r?$' "$LOCAL_ENV_PATH" || {
            echo '::error::APP_ENV must be staging'
            exit 1
          }

          grep -Eq '^APP_DEBUG=false\r?$' "$LOCAL_ENV_PATH" || {
            echo '::error::APP_DEBUG must be false'
            exit 1
          }

          grep -Eq '^APP_KEY=base64:[A-Za-z0-9+/=]+\r?$' "$LOCAL_ENV_PATH" || {
            echo '::error::Restore the existing APP_KEY in LOCAL_ENV_PATH'
            exit 1
          }

          grep -Eq '^APP_URL=https://' "$LOCAL_ENV_PATH" || {
            echo '::error::APP_URL must be HTTPS'
            exit 1
          }

          echo "Staging configuration validated"

      - name: Select protected deployment mode
        id: mode
        run: |
          set -euo pipefail

          if [[ "${BOOTSTRAP_REQUESTED:-false}" == 'true' ]]; then
            [[ "$BOOTSTRAP_CONFIRMATION" == 'Confirm' ]] || {
              echo '::error::One-time bootstrap confirmation is missing'
              exit 1
            }
            echo 'preflight_action=bootstrap-preflight' >> "$GITHUB_OUTPUT"
            echo 'deploy_action=bootstrap' >> "$GITHUB_OUTPUT"
            echo 'rollback_action=rollback' >> "$GITHUB_OUTPUT"
            echo 'One-time staging bootstrap selected. Database migrations will NOT run.'
          else
            echo 'preflight_action=preflight' >> "$GITHUB_OUTPUT"
            echo 'deploy_action=deploy' >> "$GITHUB_OUTPUT"
            echo 'rollback_action=rollback' >> "$GITHUB_OUTPUT"
            echo 'Protected normal deployment selected.'
          fi

      # ======================================================
      # 3. Configure verified SSH
      # ======================================================

      - name: Configure verified SSH
        env:
          SSH_HOST: ${{ secrets.DEV_SERVER_HOST }}
          SSH_USER: ${{ secrets.DEV_SERVER_USER }}
          SSH_PORT: ${{ secrets.DEV_SERVER_PORT }}
          SSH_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SERVER_KNOWN_HOSTS }}

        run: |
          set -euo pipefail
          umask 077

          : "${SSH_HOST:?Missing SSH host}"
          : "${SSH_USER:?Missing SSH user}"
          : "${SSH_KEY:?Missing private SSH key}"
          : "${KNOWN_HOSTS:?Missing pinned SSH host key}"

          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[A-Za-z0-9_-]+$ ]]

          [[ "${SSH_PORT:-22}" =~ ^[0-9]{1,5}$ ]]

          (( 10#${SSH_PORT:-22} >= 1 &&
             10#${SSH_PORT:-22} <= 65535 ))

          mkdir -p -m 700 "$RUNNER_TEMP/deploy-ssh"

          printf '%s\n' "$SSH_KEY" \
            > "$RUNNER_TEMP/deploy-ssh/key"

          printf '%s\n' "$KNOWN_HOSTS" \
            > "$RUNNER_TEMP/deploy-ssh/known_hosts"

          chmod 600 \
            "$RUNNER_TEMP/deploy-ssh/key" \
            "$RUNNER_TEMP/deploy-ssh/known_hosts"

          cat > "$RUNNER_TEMP/deploy-ssh/config" <<EOF
          Host cpanel-deploy
            HostName $SSH_HOST
            User $SSH_USER
            Port ${SSH_PORT:-22}
            IdentityFile $RUNNER_TEMP/deploy-ssh/key
            UserKnownHostsFile $RUNNER_TEMP/deploy-ssh/known_hosts
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 5
          EOF

          chmod 600 "$RUNNER_TEMP/deploy-ssh/config"

      # ======================================================
      # 4. Verify previous Laravel application before upload
      # ======================================================

      - name: Verify current application can be rolled back
        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            "bash -se -- '${{ steps.mode.outputs.preflight_action }}' '$REMOTE_DEPLOY_DIR' '${REMOTE_WEB_ROOT:-public_html}' '$RELEASE_ID' '$BACKEND_URL' '$EXPECTED_DB_HOST' '$EXPECTED_DB_DATABASE'" \
            < scripts/deploy.sh


      - name: Verify staging APP_KEY
        run: |
          set -euo pipefail

          test -r "$LOCAL_ENV_PATH" || {
            echo "::error::Environment file not readable"
            exit 1
          }

          ENV_FILE="$LOCAL_ENV_PATH" php <<'PHP'
          <?php
          $env = parse_ini_file(
              getenv('ENV_FILE'),
              false,
              INI_SCANNER_RAW
          );

          $key = trim(
              (string) ($env['APP_KEY'] ?? ''),
              "\"'"
          );

          $expected = '61a14ec1802024cba80b001cc776967ef72f2e260b9f2981a24a128d0447a1a7';

          if (!hash_equals($expected, hash('sha256', $key))) {
              fwrite(STDERR, "APP_KEY mismatch in runner file\n");
              exit(1);
          }

          echo "Staging APP_KEY verified successfully\n";
          PHP

      # ======================================================
      # 5. Package source code and generate SHA-256
      # ======================================================

      - name: Package and checksum release
        run: |
          set -euo pipefail
          umask 077

          git archive --format=tar HEAD \
            | gzip -6 > "$RUNNER_TEMP/$RELEASE_ID.tar.gz"

          (
            cd "$RUNNER_TEMP"

            shasum -a 256 "$RELEASE_ID.tar.gz" \
              > "$RELEASE_ID.sha256"
          )

          cp "$LOCAL_ENV_PATH" \
            "$RUNNER_TEMP/$RELEASE_ID.env"

          chmod 600 "$RUNNER_TEMP/$RELEASE_ID.env"

          tar -tzf "$RUNNER_TEMP/$RELEASE_ID.tar.gz" >/dev/null

          echo "Release archive and checksum generated"

      # ======================================================
      # 6. Upload into private remote directory
      # ======================================================

      - name: Upload release to private incoming directory
        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            "mkdir -p \"\$HOME/$REMOTE_DEPLOY_DIR/.incoming\" && chmod 700 \"\$HOME/$REMOTE_DEPLOY_DIR/.incoming\""

          scp -q \
            -F "$RUNNER_TEMP/deploy-ssh/config" \
            "$RUNNER_TEMP/$RELEASE_ID.tar.gz" \
            "$RUNNER_TEMP/$RELEASE_ID.sha256" \
            "$RUNNER_TEMP/$RELEASE_ID.env" \
            "cpanel-deploy:$REMOTE_DEPLOY_DIR/.incoming/"

          echo "Release uploaded"

      # ======================================================
      # 7. Deploy with automatic recovery
      # ======================================================

      - name: Deploy with automatic recovery
        id: deploy_release

        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            "bash -se -- '${{ steps.mode.outputs.deploy_action }}' '$REMOTE_DEPLOY_DIR' '${REMOTE_WEB_ROOT:-public_html}' '$RELEASE_ID' '$BACKEND_URL' '$EXPECTED_DB_HOST' '$EXPECTED_DB_DATABASE'" \
            < scripts/deploy.sh

      # Validate the actual published Laravel DB connection (not only HTTP 200).
      - name: Verify active release and database connectivity
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            "bash -se -- verify '$REMOTE_DEPLOY_DIR' '${REMOTE_WEB_ROOT:-public_html}' '$RELEASE_ID' '$BACKEND_URL' '$EXPECTED_DB_HOST' '$EXPECTED_DB_DATABASE'" \
            < scripts/deploy.sh

      # ======================================================
      # 9. Rollback if external verification fails
      # ======================================================

      - name: Roll back if external verification fails
        if: failure() && steps.deploy_release.outcome == 'success'

        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            "bash -se -- rollback '$REMOTE_DEPLOY_DIR' '${REMOTE_WEB_ROOT:-public_html}' '$RELEASE_ID' '$BACKEND_URL' '$EXPECTED_DB_HOST' '$EXPECTED_DB_DATABASE'" \
            < scripts/deploy.sh

          # A rollback restores files, not applied database migrations.
          echo '::warning::Rollback restored the previous application files; check database schema compatibility and live health.'

      # Release pruning occurs only after successful release and DB verification.
      # Backup snapshots (especially database.sql.gz) are not auto-deleted.
      - name: Prune old staging releases safely
        if: success() && steps.deploy_release.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            "bash -se -- cleanup '$REMOTE_DEPLOY_DIR' '${REMOTE_WEB_ROOT:-public_html}' '$RELEASE_ID' '$BACKEND_URL' '$EXPECTED_DB_HOST' '$EXPECTED_DB_DATABASE'" \
            < scripts/deploy.sh

      # ======================================================
      # 10. Cleanup temporary files
      # ======================================================

      - name: Clean temporary files
        if: always()

        run: |
          if [[ -f "$RUNNER_TEMP/deploy-ssh/config" &&
                "$REMOTE_DEPLOY_DIR" =~ ^[A-Za-z0-9_-]+$ ]]; then

            ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
              cpanel-deploy \
              "rm -f \"\$HOME/$REMOTE_DEPLOY_DIR/.incoming/$RELEASE_ID.tar.gz\" \"\$HOME/$REMOTE_DEPLOY_DIR/.incoming/$RELEASE_ID.sha256\" \"\$HOME/$REMOTE_DEPLOY_DIR/.incoming/$RELEASE_ID.env\"" \
              || true

          fi

          rm -rf "$RUNNER_TEMP/deploy-ssh"

          rm -f \
            "$RUNNER_TEMP/$RELEASE_ID.tar.gz" \
            "$RUNNER_TEMP/$RELEASE_ID.sha256" \
            "$RUNNER_TEMP/$RELEASE_ID.env" \
            "$RUNNER_TEMP/health-response"

          echo "Temporary cleanup completed"
