
name: Deploy Development

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy React Vite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SERVER_HOST: ${{ secrets.DEV_SERVER_HOST }}
      SERVER_USER: ${{ secrets.DEV_SERVER_USER }}
      SERVER_PORT: ${{ secrets.DEV_SERVER_PORT }}

    steps:
      # Step 1: Configure SSH
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          echo "Configuring SSH..."

          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_PORT"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH configured successfully"

      # Step 2: Validate SSH Private Key
      - name: Validate SSH Private Key
        run: |
          set -euo pipefail

          ssh-keygen -y -P "" \
            -f "$HOME/.ssh/deploy_key" \
            > /dev/null

          echo "SSH private key is valid"

      # Step 3: Diagnose SSH Network
      - name: Diagnose SSH Network
        run: |
          set -euo pipefail

          echo "Checking DNS..."
          getent ahostsv4 "$SERVER_HOST"

          echo "Testing SSH connectivity..."
          nc -4 -vz -w 15 \
            "$SERVER_HOST" "$SERVER_PORT"

          echo "Network connection successful"

      # Step 4: Test SSH Connection
      - name: Test SSH Connection
        run: |
          set -euo pipefail

          ssh \
            -4 \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" \
            'whoami && hostname'

          echo "SSH authentication successful"

      # Step 5: Deploy and Build Application
      - name: Deploy React Vite Application
        run: |
          set -euo pipefail

          echo "Starting React Vite deployment..."

          ssh \
            -4 \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" \
            'bash "$HOME/apps/my-project-dev/deploy-dev.sh"'

          echo "Deployment script finished"

      # Step 6: Verify Published Files
      - name: Verify Deployment Files
        run: |
          set -euo pipefail

          echo "Checking website deployment files..."

          ssh \
            -4 \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" \
            'test -s "$HOME/public_html/index.html" && \
             test -d "$HOME/public_html/assets" && \
             echo "Build files successfully published"'

      # Step 7: Verify Website HTTP Response
      - name: Verify Website
        run: |
          set -euo pipefail

          echo "Checking test.thelendsystem.com..."

          curl \
            -fLsS \
            --retry 3 \
            --max-time 20 \
            -o /dev/null \
            https://test.thelendsystem.com/

          echo "Website is responding successfully"

      # Step 8: Deployment Summary
      - name: Deployment Summary
        if: success()
        run: |
          echo "================================"
          echo "Deployment Successful"
          echo "================================"
          echo "Website: https://test.thelendsystem.com"
          echo "Branch: main"
          echo "Build: React + Vite"
          echo "Document root: public_html"
          echo "================================"
