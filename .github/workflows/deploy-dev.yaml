name: Deploy Development

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Application to cPanel
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      LOCAL_ENV_PATH: ${{ secrets.LOCAL_ENV_PATH }}
      REMOTE_DEPLOY_DIR: ${{ secrets.REMOTE_DEPLOY_DIR }}
      REMOTE_WEB_ROOT: ${{ secrets.REMOTE_WEB_ROOT }}
      BACKEND_URL: ${{ secrets.BACKEND_URL }}

    steps:

      # ====================================
      # 1. Checkout source code
      # ====================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      # ====================================
      # 2. Validate deployment configuration
      # ====================================
      - name: Validate configuration
        run: |
          set -euo pipefail

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

          : "${LOCAL_ENV_PATH:?LOCAL_ENV_PATH is missing}"
          : "${REMOTE_DEPLOY_DIR:?REMOTE_DEPLOY_DIR is missing}"
          : "${BACKEND_URL:?BACKEND_URL is missing}"

          if [[ ! -s "$LOCAL_ENV_PATH" ]]; then
            echo "::error::Local .env missing or empty"
            exit 1
          fi

          if [[ ! -r "$LOCAL_ENV_PATH" ]]; then
            echo "::error::Cannot read local .env"
            exit 1
          fi

          if [[ ! -f scripts/deploy.sh ]]; then
            echo "::error::scripts/deploy.sh is missing"
            exit 1
          fi

          bash -n scripts/deploy.sh

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must not be tracked in Git"
            exit 1
          fi

          if [[ ! "$REMOTE_DEPLOY_DIR" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Invalid REMOTE_DEPLOY_DIR"
            exit 1
          fi

          if [[ -n "${REMOTE_WEB_ROOT:-}" ]]; then
            if [[ ! "$REMOTE_WEB_ROOT" =~ ^[A-Za-z0-9_][A-Za-z0-9_./-]*$ ]] \
                || [[ "$REMOTE_WEB_ROOT" == *..* ]]; then
              echo "::error::Invalid REMOTE_WEB_ROOT"
              exit 1
            fi
          fi

          if [[ ! "$BACKEND_URL" =~ ^https?://[^[:space:]]+$ ]]; then
            echo "::error::Invalid BACKEND_URL"
            exit 1
          fi

          echo "Configuration validated successfully"

      # ====================================
      # 3. Configure secure SSH
      # ====================================
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.DEV_SERVER_HOST }}
          SSH_USER: ${{ secrets.DEV_SERVER_USER }}
          SSH_PORT: ${{ secrets.DEV_SERVER_PORT }}
          SSH_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077

          : "${SSH_HOST:?SSH host missing}"
          : "${SSH_USER:?SSH username missing}"
          : "${SSH_KEY:?SSH private key missing}"
          : "${KNOWN_HOSTS:?SSH known hosts missing}"

          SSH_DIR="$RUNNER_TEMP/deploy-ssh"

          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"

          printf '%s\n' "$SSH_KEY" > "$SSH_DIR/id_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$SSH_DIR/known_hosts"

          chmod 600 "$SSH_DIR/id_deploy" "$SSH_DIR/known_hosts"

          {
            echo "Host cpanel-deploy"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port ${SSH_PORT:-22}"
            echo "  IdentityFile $SSH_DIR/id_deploy"
            echo "  UserKnownHostsFile $SSH_DIR/known_hosts"
            echo "  StrictHostKeyChecking yes"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 15"
            echo "  ConnectionAttempts 3"
            echo "  ServerAliveInterval 30"
            echo "  ServerAliveCountMax 5"
          } > "$SSH_DIR/config"

          chmod 600 "$SSH_DIR/config"

          echo "SSH configured successfully"

      # ====================================
      # 4. Test SSH + prepare remote directory
      # ====================================
      - name: Connect and prepare server directory
        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            "mkdir -p \"\$HOME/$REMOTE_DEPLOY_DIR\" && echo 'SSH connection OK, directory ready'"

      # ====================================
      # 5. Package application source
      # ====================================
      - name: Package source code
        run: |
          set -euo pipefail

          git archive --format=tar HEAD \
            | gzip -6 > "$RUNNER_TEMP/app-release.tar.gz"

          test -s "$RUNNER_TEMP/app-release.tar.gz"

          echo "Source archive created ($(du -h "$RUNNER_TEMP/app-release.tar.gz" | cut -f1))"

      # ====================================
      # 6. Upload source + .env (single connection)
      # ====================================
      - name: Upload release files
        run: |
          set -euo pipefail
          umask 077

          cp "$LOCAL_ENV_PATH" "$RUNNER_TEMP/.env.upload"

          scp -q \
            -F "$RUNNER_TEMP/deploy-ssh/config" \
            "$RUNNER_TEMP/app-release.tar.gz" \
            "$RUNNER_TEMP/.env.upload" \
            "cpanel-deploy:$REMOTE_DEPLOY_DIR/"

          rm -f "$RUNNER_TEMP/.env.upload"

          echo "Release files uploaded successfully"

      # ====================================
      # 7. Execute project deployment
      # ====================================
      - name: Deploy application
        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            "bash -se -- '$REMOTE_DEPLOY_DIR' '${REMOTE_WEB_ROOT:-}'" <<'REMOTE'
          set -euo pipefail
          umask 077

          DEPLOY_DIR="$1"
          REMOTE_WEB_ROOT="${2:-}"
          PHP_BIN="/opt/cpanel/ea-php84/root/usr/bin/php"

          cd "$HOME/$DEPLOY_DIR"

          echo "STEP 1: Checking uploaded files"
          test -s app-release.tar.gz
          test -s .env.upload
          tar -tzf app-release.tar.gz >/dev/null

          echo "STEP 2: Enabling maintenance mode"
          if [ -f artisan ] && [ -f vendor/autoload.php ] && [ -x "$PHP_BIN" ]; then
            "$PHP_BIN" artisan down --retry=15 \
              || echo "WARNING: Could not enable maintenance mode"
          else
            echo "First deployment detected, skipping maintenance mode"
          fi

          echo "STEP 3: Extracting application"
          tar -tzf app-release.tar.gz | sed '/\/$/d' | LC_ALL=C sort > .release-manifest.new
          tar -xzf app-release.tar.gz

          echo "STEP 4: Removing files deleted from Git"
          if [ -f .release-manifest ]; then
            LC_ALL=C comm -23 .release-manifest .release-manifest.new \
              | while IFS= read -r file; do
                  case "$file" in
                    ""|/*|*..*) continue ;;
                  esac
                  if [ -f "$file" ] || [ -L "$file" ]; then
                    rm -f -- "$file"
                    echo "Removed: $file"
                  fi
                done
          else
            echo "No previous manifest, skipping"
          fi
          mv -f .release-manifest.new .release-manifest

          echo "STEP 5: Installing environment"
          chmod 600 .env.upload
          mv -f .env.upload .env

          echo "STEP 6: Checking deployment script"
          test -f scripts/deploy.sh
          bash -n scripts/deploy.sh

          echo "STEP 7: Running Laravel deployment"
          export REMOTE_WEB_ROOT
          bash scripts/deploy.sh

          echo "STEP 8: Cleanup"
          rm -f app-release.tar.gz .release-upload.tar.gz

          echo "Application deployment successful"
          REMOTE

      # ====================================
      # 8. Verify backend domain
      # ====================================
      - name: Verify backend domain
        run: |
          set -euo pipefail

          HEALTH_URL="${BACKEND_URL%/}/api/health"
          RESPONSE_FILE="$RUNNER_TEMP/backend-health-response.txt"

          echo "Checking backend: $HEALTH_URL"

          HTTP_CODE="$(curl -sS -L \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 30 \
            -o "$RESPONSE_FILE" \
            -w '%{http_code}' \
            "$HEALTH_URL")"

          echo "HTTP Status: $HTTP_CODE"

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Backend health check failed ($HTTP_CODE)"
            echo "Response (first 1000 bytes):"
            head -c 1000 "$RESPONSE_FILE" || true
            echo
            exit 1
          fi

          echo "Backend health check passed"

      # ====================================
      # 9. Cleanup local temporary files
      # ====================================
      - name: Cleanup temporary files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/deploy-ssh"
          rm -f "$RUNNER_TEMP/app-release.tar.gz"
          rm -f "$RUNNER_TEMP/.env.upload"
          rm -f "$RUNNER_TEMP/backend-health-response.txt"