
name: Deploy Development

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy React Vite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SERVER_HOST: ${{ secrets.DEV_SERVER_HOST }}
      SERVER_USER: ${{ secrets.DEV_SERVER_USER }}
      SERVER_PORT: ${{ secrets.DEV_SERVER_PORT }}
      WEBSITE_URL: https://test.thelendsystem.com

    steps:
      # Step 1: Checkout exact commit
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Build React Vite
      - name: Build Application
        run: |
          set -euo pipefail

          echo "Building commit: $GITHUB_SHA"
          npm run build

          test -s dist/index.html
          test -d dist/assets

          echo "=== Build files ==="
          find dist -maxdepth 2 -type f

          echo "=== React source ==="
          sed -n '1,80p' src/App.jsx

          echo "Build completed successfully"

      # Step 5: Prepare deployment metadata
      - name: Prepare Deployment Version
        run: |
          set -euo pipefail

          printf '%s\n' "$GITHUB_SHA" \
            > dist/deployment-version.txt

          echo "Deployment commit: $GITHUB_SHA"

      # Step 6: Configure SSH
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_PORT"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y -P "" \
            -f "$HOME/.ssh/deploy_key" \
            > /dev/null

          echo "SSH configuration complete"

      # Step 7: Test connection
      - name: Test SSH Connection
        run: |
          set -euo pipefail

          nc -4 -vz -w 15 \
            "$SERVER_HOST" "$SERVER_PORT"

          ssh \
            -4 \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" \
            'whoami && test -d "$HOME/public_html"'

          echo "SSH connection successful"

      # Step 8: Deploy build
      - name: Deploy to cPanel
        run: |
          set -euo pipefail

          echo "Uploading React build..."

          rsync -avz \
            --checksum \
            --exclude='.htaccess' \
            --exclude='.user.ini' \
            --exclude='php.ini' \
            --exclude='.well-known/' \
            --exclude='cgi-bin/' \
            -e "ssh -4 \
              -i $HOME/.ssh/deploy_key \
              -p $SERVER_PORT \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20" \
            dist/ \
            "$SERVER_USER@$SERVER_HOST:public_html/"

          echo "Build uploaded"

      # Step 9: Verify remote files match build
      - name: Verify Uploaded Files
        run: |
          set -euo pipefail

          echo "Comparing uploaded files..."

          rsync -avnc \
            --out-format='%n' \
            -e "ssh -4 \
              -i $HOME/.ssh/deploy_key \
              -p $SERVER_PORT \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes" \
            dist/ \
            "$SERVER_USER@$SERVER_HOST:public_html/" \
            > /tmp/rsync-diff.txt

          if [ -s /tmp/rsync-diff.txt ]; then
            echo "ERROR: Server files differ from build"
            cat /tmp/rsync-diff.txt
            exit 1
          fi

          echo "Uploaded files match build"

      # Step 10: Verify live deployment
      - name: Verify Live Website
        run: |
          set -euo pipefail

          echo "Checking live website..."

          curl -fLsS \
            --retry 3 \
            --max-time 20 \
            -H "Cache-Control: no-cache" \
            "$WEBSITE_URL/?sha=$GITHUB_SHA" \
            -o live-index.html

          echo "Checking live commit..."

          LIVE_COMMIT=$(curl -fLsS \
            --max-time 20 \
            -H "Cache-Control: no-cache" \
            "$WEBSITE_URL/deployment-version.txt?sha=$GITHUB_SHA")

          echo "Expected commit: $GITHUB_SHA"
          echo "Live commit: $LIVE_COMMIT"

          test "$LIVE_COMMIT" = "$GITHUB_SHA" || {
            echo "ERROR: Live commit mismatch"
            exit 1
          }

          echo "Checking live HTML asset references..."

          grep -oE '/assets/[^"]+' \
            dist/index.html > expected-assets.txt

          grep -oE '/assets/[^"]+' \
            live-index.html > live-assets.txt

          if ! diff -u expected-assets.txt live-assets.txt; then
            echo "ERROR: Live HTML references old assets"
            exit 1
          fi

          echo "Checking JavaScript and CSS assets..."

          while IFS= read -r asset; do
            test -n "$asset" || continue

            curl -fLsS \
              --max-time 20 \
              -H "Cache-Control: no-cache" \
              "$WEBSITE_URL$asset?sha=$GITHUB_SHA" \
              -o live-asset.tmp

            cmp \
              "dist${asset}" \
              live-asset.tmp || {
                echo "ERROR: Live asset differs: $asset"
                exit 1
              }
          done < expected-assets.txt

          echo "Live website assets match build"

      # Step 11: Summary
      - name: Deployment Summary
        if: success()
        run: |
          echo "## Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Website: $WEBSITE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: main" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Framework: React + Vite" >> "$GITHUB_STEP_SUMMARY"
          echo "- Document root: public_html" >> "$GITHUB_STEP_SUMMARY"
