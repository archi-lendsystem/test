name: Deploy Development

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/staging'
    name: Build Audit and Deploy React Vite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    environment:
      name: development

    env:
      SERVER_HOST: ${{ secrets.DEV_SERVER_HOST }}
      SERVER_USER: ${{ secrets.DEV_SERVER_USER }}
      SERVER_PORT: ${{ secrets.DEV_SERVER_PORT }}
      WEBSITE_URL: ${{ secrets.DEV_WEBSITE_URL }}

    defaults:
      run:
        shell: bash

    steps:
      # Step 1: Checkout exact commit
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Production dependency security audit
      - name: NPM Security Audit
        run: |
          set -euo pipefail

          echo "Auditing production dependencies (devDependencies excluded)..."

          npm audit --omit=dev --audit-level=high

          echo "Production security audit passed"

      - name: Full Dependency Audit Report
        if: success()
        run: |
          npm audit --json > npm-audit-report.json || true

      - name: Upload Security Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-audit
          path: npm-audit-report.json
          retention-days: 14
          if-no-files-found: warn

      # Step 5: Run lint and tests
      - name: Lint and Test
        run: |
          set -euo pipefail

          npm run lint --if-present

          if npm run | grep -qE '^[[:space:]]+test$'; then
            npm test -- --run
          else
            echo "No test script configured"
          fi

      # Step 6: Build React Vite
      - name: Build Application
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          set -euo pipefail

          echo "Building commit: $GITHUB_SHA"

          npm run build

          test -s dist/index.html
          test -d dist/assets

          echo "=== Build files ==="
          find dist -maxdepth 2 -type f

          echo "Build completed successfully"

      # Step 7: Lighthouse Quality Audit
      - name: Lighthouse Quality Audit
        run: |
          set -euo pipefail

          test -f lighthouserc.cjs

          echo "Installing Lighthouse CI..."

          npm install --global @lhci/cli@0.15.1

          echo "Running Lighthouse Audit..."

          lhci autorun

          echo "Lighthouse audit completed"

      # Step 8: Upload Lighthouse Reports
      - name: Upload Lighthouse Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 14
          if-no-files-found: warn

      # Step 9: Prepare deployment metadata
      - name: Prepare Deployment Version
        run: |
          set -euo pipefail

          printf '%s\n' "$GITHUB_SHA" \
            > dist/deployment-version.txt

          echo "Deployment commit: $GITHUB_SHA"

      # Step 10: Create rsync exclusions
      - name: Prepare Rsync Exclusions
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/rsync-exclude.txt" <<'EOF'
          .htaccess
          .user.ini
          php.ini
          .well-known/
          cgi-bin/
          EOF

          echo "Shared rsync exclusions created"

      # Step 11: Configure SSH
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_PORT"
          test -n "$WEBSITE_URL"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y -P "" \
            -f "$HOME/.ssh/deploy_key" \
            > /dev/null

          cat > "$HOME/.ssh/config" <<EOF
          Host deploy-server
              HostName $SERVER_HOST
              User $SERVER_USER
              Port $SERVER_PORT
              IdentityFile $HOME/.ssh/deploy_key
              IdentitiesOnly yes
              BatchMode yes
              StrictHostKeyChecking yes
              UserKnownHostsFile $HOME/.ssh/known_hosts
              ConnectTimeout 20
              AddressFamily inet
              ServerAliveInterval 15
          EOF

          chmod 600 "$HOME/.ssh/config"

          echo "SSH configuration complete"

      # Step 12: Test SSH connection
      - name: Test SSH Connection
        run: |
          set -euo pipefail

          nc -4 -vz -w 15 \
            "$SERVER_HOST" "$SERVER_PORT"

          ssh deploy-server \
            'whoami && test -d "$HOME/public_html"'

          echo "SSH connection successful"

      # Step 13: Deploy application files
      - name: Deploy Application Files
        run: |
          set -euo pipefail

          echo "Phase 1: Uploading application files..."

          rsync -avz \
            --checksum \
            --chmod=D755,F644 \
            --exclude-from="$RUNNER_TEMP/rsync-exclude.txt" \
            --exclude='/index.html' \
            --exclude='/deployment-version.txt' \
            dist/ \
            deploy-server:public_html/

          echo "Phase 1 completed"

          echo "Phase 2: Publishing index.html..."

          rsync -avz \
            --checksum \
            --chmod=D755,F644 \
            dist/index.html \
            deploy-server:public_html/index.html

          echo "Publishing deployment version..."

          rsync -avz \
            --checksum \
            --chmod=D755,F644 \
            dist/deployment-version.txt \
            deploy-server:public_html/deployment-version.txt

          echo "Application deployment completed"

      # Step 14: Verify uploaded files
      - name: Verify Uploaded Files
        run: |
          set -euo pipefail

          echo "Comparing build with server files..."

          DIFF=$(rsync -rcn \
            --out-format='%n' \
            --exclude-from="$RUNNER_TEMP/rsync-exclude.txt" \
            dist/ \
            deploy-server:public_html/)

          if [ -n "$DIFF" ]; then
            echo "ERROR: Build files differ from server"
            echo "$DIFF"
            exit 1
          fi

          echo "SUCCESS: Uploaded files match build"

      # Step 15: Verify live website
      - name: Verify Live Website
        run: |
          set -euo pipefail

          fetch() {
            curl \
              -fLsS \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --max-time 20 \
              -H "Cache-Control: no-cache" \
              "$@"
          }

          WEBSITE_URL="${WEBSITE_URL%/}"
          test -n "$WEBSITE_URL"

          echo "Checking live website..."

          fetch \
            "$WEBSITE_URL/?sha=$GITHUB_SHA" \
            -o live-index.html

          echo "Checking live deployment commit..."

          LIVE_COMMIT=$(fetch \
            "$WEBSITE_URL/deployment-version.txt?sha=$GITHUB_SHA")

          echo "Expected commit: $GITHUB_SHA"
          echo "Live commit: $LIVE_COMMIT"

          if [ "$LIVE_COMMIT" != "$GITHUB_SHA" ]; then
            echo "ERROR: Live commit mismatch"
            exit 1
          fi

          echo "Checking complete live HTML..."

          if ! cmp -s dist/index.html live-index.html; then
            echo "ERROR: Live HTML differs from build"
            exit 1
          fi

          echo "SUCCESS: Live HTML matches build"

          echo "Extracting build asset references..."

          grep -oE "/assets/[^\"'[:space:]<>]+" \
            dist/index.html > expected-assets.txt || true

          grep -oE "/assets/[^\"'[:space:]<>]+" \
            live-index.html > live-assets.txt || true

          if ! diff -u expected-assets.txt live-assets.txt; then
            echo "ERROR: Live HTML references incorrect assets"
            exit 1
          fi

          echo "Checking JavaScript and CSS assets..."

          while IFS= read -r asset; do
            test -n "$asset" || continue

            if [ ! -f "dist${asset}" ]; then
              echo "ERROR: Asset not found in build: $asset"
              exit 1
            fi

            fetch \
              "$WEBSITE_URL$asset?sha=$GITHUB_SHA" \
              -o live-asset.tmp

            if ! cmp -s "dist${asset}" live-asset.tmp; then
              echo "ERROR: Live asset differs: $asset"
              exit 1
            fi

            echo "Verified: $asset"

          done < expected-assets.txt

          echo "SUCCESS: Live website matches build"

      # Step 16: Deployment Summary
      - name: Deployment Summary
        if: always()
        run: |
          {
            echo "## Development Deployment Report"
            echo ""
            echo "- Website: $WEBSITE_URL"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Environment: development"
            echo "- Framework: React + Vite"
            echo "- Document root: public_html"
            echo "- Workflow result: ${{ job.status }}"
            echo ""
            echo "### Configured Quality Checks"
            echo "- NPM Security Audit"
            echo "- Lint and Tests"
            echo "- Lighthouse Quality Audit"
            echo "- SSH and rsync verification"
            echo "- Live website verification"
            echo ""
            echo "Check individual step results above; listed checks are not pass/fail assertions."
          echo "Download Lighthouse reports from the workflow artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
