
name: Deploy Development

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-staging
  cancel-in-progress: false

jobs:
  # ==========================================================
  # 1. Validate and test before deployment
  # ==========================================================

  tests:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      
      - name: Validate dependencies and run tests
        run: |
          set -euo pipefail

          bash -n scripts/deploy.sh

          composer validate --no-check-publish

          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress

          composer check-platform-reqs

          if [[ -d tests ]] && \
            find tests -type f -name '*Test.php' -print -quit | grep -q .; then

            # Create a safe testing environment without production secrets.
            if [[ -f .env.example ]]; then
              cp .env.example .env
            else
              echo "::warning::.env.example missing; creating isolated testing environment"
              touch .env
            fi

            {
              echo "APP_ENV=testing"
              echo "APP_DEBUG=true"
              echo "DB_CONNECTION=sqlite"
              echo "DB_DATABASE=:memory:"
              echo "CACHE_STORE=array"
              echo "SESSION_DRIVER=array"
              echo "QUEUE_CONNECTION=sync"
              echo "MAIL_MAILER=array"
            } >> .env

            php artisan key:generate --force

            php artisan test --stop-on-failure

          else
            echo "::warning::No Laravel tests found"
          fi


  # ==========================================================
  # 2. Deploy only from approved staging branch
  # ==========================================================

  deploy:
    name: Deploy Application to cPanel

    needs: tests

    if: github.ref == 'refs/heads/staging'

    environment: staging

    runs-on: [self-hosted, macOS, ARM64]

    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    env:
      LOCAL_ENV_PATH: ${{ secrets.LOCAL_ENV_PATH }}
      REMOTE_DEPLOY_DIR: ${{ secrets.REMOTE_DEPLOY_DIR }}
      REMOTE_WEB_ROOT: ${{ secrets.REMOTE_WEB_ROOT }}
      BACKEND_URL: ${{ secrets.BACKEND_URL }}

      EXPECTED_DB_HOST: ${{ secrets.EXPECTED_DB_HOST }}
      EXPECTED_DB_DATABASE: ${{ secrets.EXPECTED_DB_DATABASE }}

      HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
      SMOKE_TEST_PATH: ${{ vars.SMOKE_TEST_PATH }}

      RELEASE_ID: ${{ github.sha }}

    steps:
      # ======================================================
      # 1. Checkout repository
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      # ======================================================
      # 2. Validate configuration and branch
      # ======================================================

      - name: Validate deployment configuration
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF" == "refs/heads/staging" ]] || {
            echo "::error::Deployment allowed only from staging branch"
            exit 1
          }

          : "${LOCAL_ENV_PATH:?LOCAL_ENV_PATH missing}"
          : "${REMOTE_DEPLOY_DIR:?REMOTE_DEPLOY_DIR missing}"
          : "${BACKEND_URL:?BACKEND_URL missing}"
          : "${EXPECTED_DB_HOST:?EXPECTED_DB_HOST missing}"
          : "${EXPECTED_DB_DATABASE:?EXPECTED_DB_DATABASE missing}"
          : "${HEALTH_CHECK_TOKEN:?HEALTH_CHECK_TOKEN missing}"

          [[ -s "$LOCAL_ENV_PATH" && -r "$LOCAL_ENV_PATH" ]] || {
            echo "::error::Local environment file missing or unreadable"
            exit 1
          }

          [[ "$REMOTE_DEPLOY_DIR" =~ ^[A-Za-z0-9_-]+$ ]] || exit 1

          [[ "${REMOTE_WEB_ROOT:-public_html}" =~ ^[A-Za-z0-9_][A-Za-z0-9_/-]*$ ]] || exit 1
          [[ "${REMOTE_WEB_ROOT:-public_html}" != *..* ]] || exit 1

          [[ "$BACKEND_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]] || exit 1

          [[ "$EXPECTED_DB_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$EXPECTED_DB_DATABASE" =~ ^[A-Za-z0-9_-]+$ ]] || exit 1

          bash -n scripts/deploy.sh

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must not be tracked in Git"
            exit 1
          fi

          echo "Deployment configuration verified"

      # ======================================================
      # 3. Configure secure SSH
      # ======================================================

      - name: Configure secure SSH
        env:
          SSH_HOST: ${{ secrets.DEV_SERVER_HOST }}
          SSH_USER: ${{ secrets.DEV_SERVER_USER }}
          SSH_PORT: ${{ secrets.DEV_SERVER_PORT }}
          SSH_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SERVER_KNOWN_HOSTS }}

        run: |
          set -euo pipefail
          umask 077

          : "${SSH_HOST:?Missing SSH host}"
          : "${SSH_USER:?Missing SSH user}"
          : "${SSH_KEY:?Missing SSH key}"
          : "${KNOWN_HOSTS:?Missing verified known hosts}"

          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "${SSH_PORT:-22}" =~ ^[0-9]{1,5}$ ]]

          (( 10#${SSH_PORT:-22} >= 1 &&
             10#${SSH_PORT:-22} <= 65535 ))

          SSH_DIR="$RUNNER_TEMP/deploy-ssh"

          mkdir -m 700 -p "$SSH_DIR"

          printf '%s\n' "$SSH_KEY" > "$SSH_DIR/id_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$SSH_DIR/known_hosts"

          chmod 600 "$SSH_DIR/id_deploy" "$SSH_DIR/known_hosts"

          cat > "$SSH_DIR/config" <<EOF
          Host cpanel-deploy
            HostName $SSH_HOST
            User $SSH_USER
            Port ${SSH_PORT:-22}
            IdentityFile $SSH_DIR/id_deploy
            UserKnownHostsFile $SSH_DIR/known_hosts
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 5
          EOF

          chmod 600 "$SSH_DIR/config"

          echo "Secure SSH configured"

      # ======================================================
      # 4. Package source and generate checksum
      # ======================================================

      - name: Package release
        run: |
          set -euo pipefail
          umask 077

          git archive --format=tar HEAD \
            | gzip -6 > "$RUNNER_TEMP/$RELEASE_ID.tar.gz"

          (
            cd "$RUNNER_TEMP"
            shasum -a 256 "$RELEASE_ID.tar.gz" \
              > "$RELEASE_ID.sha256"
          )

          cp "$LOCAL_ENV_PATH" \
            "$RUNNER_TEMP/$RELEASE_ID.env"

          chmod 600 "$RUNNER_TEMP/$RELEASE_ID.env"

          tar -tzf "$RUNNER_TEMP/$RELEASE_ID.tar.gz" >/dev/null

          echo "Release archive and checksum generated"

      # ======================================================
      # 5. Upload into isolated remote directory
      # ======================================================

      - name: Upload release files
        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            "mkdir -p \"\$HOME/$REMOTE_DEPLOY_DIR/.incoming\" && chmod 700 \"\$HOME/$REMOTE_DEPLOY_DIR/.incoming\""

          scp -q \
            -F "$RUNNER_TEMP/deploy-ssh/config" \
            "$RUNNER_TEMP/$RELEASE_ID.tar.gz" \
            "$RUNNER_TEMP/$RELEASE_ID.sha256" \
            "$RUNNER_TEMP/$RELEASE_ID.env" \
            "cpanel-deploy:$REMOTE_DEPLOY_DIR/.incoming/"

          echo "Files uploaded successfully"

      # ======================================================
      # 6. Execute deployment with rollback handling
      # ======================================================

      - name: Deploy Laravel application
        id: deploy_release

        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            "bash -se -- deploy '$REMOTE_DEPLOY_DIR' '${REMOTE_WEB_ROOT:-public_html}' '$RELEASE_ID' '$BACKEND_URL' '$EXPECTED_DB_HOST' '$EXPECTED_DB_DATABASE'" \
            < scripts/deploy.sh

      # ======================================================
      # 7. Verify backend and optional business endpoint
      # ======================================================

      - name: Verify backend functionality
        run: |
          set -euo pipefail

          HEALTH_URL="${BACKEND_URL%/}/api/health"

          HTTP_CODE="$(curl \
            --silent \
            --show-error \
            --proto '=https' \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 2 \
            -H "Authorization: Bearer $HEALTH_CHECK_TOKEN" \
            -H 'Accept: application/json' \
            -o "$RUNNER_TEMP/health-response" \
            -w '%{http_code}' \
            "$HEALTH_URL")"

          [[ "$HTTP_CODE" == "200" ]] || {
            echo "::error::Backend health check failed"
            exit 1
          }

          if [[ -n "${SMOKE_TEST_PATH:-}" ]]; then

            [[ "$SMOKE_TEST_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]] || exit 1
            [[ "$SMOKE_TEST_PATH" != *..* ]] || exit 1

            SMOKE_STATUS="$(curl \
              --silent \
              --show-error \
              --proto '=https' \
              --connect-timeout 10 \
              --max-time 30 \
              -H "Authorization: Bearer $HEALTH_CHECK_TOKEN" \
              -H 'Accept: application/json' \
              -o /dev/null \
              -w '%{http_code}' \
              "${BACKEND_URL%/}$SMOKE_TEST_PATH")"

            [[ "$SMOKE_STATUS" == "200" ]] || {
              echo "::error::Additional smoke test failed"
              exit 1
            }

          fi

          echo "Backend verification passed"

      # ======================================================
      # 8. Roll back on external verification failure
      # ======================================================

      - name: Automatic rollback
        if: failure() && steps.deploy_release.outcome == 'success'

        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            "bash -se -- rollback '$REMOTE_DEPLOY_DIR' '${REMOTE_WEB_ROOT:-public_html}' '$RELEASE_ID' '$BACKEND_URL' '$EXPECTED_DB_HOST' '$EXPECTED_DB_DATABASE'" \
            < scripts/deploy.sh

      # ======================================================
      # 9. Clean temporary files
      # ======================================================

      - name: Cleanup deployment files
        if: always()

        run: |
          if [[ -f "$RUNNER_TEMP/deploy-ssh/config" ]]; then

            ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
              cpanel-deploy \
              "rm -f \"\$HOME/$REMOTE_DEPLOY_DIR/.incoming/$RELEASE_ID.tar.gz\" \"\$HOME/$REMOTE_DEPLOY_DIR/.incoming/$RELEASE_ID.sha256\" \"\$HOME/$REMOTE_DEPLOY_DIR/.incoming/$RELEASE_ID.env\"" \
              || true

          fi

          rm -rf "$RUNNER_TEMP/deploy-ssh"

          rm -f \
            "$RUNNER_TEMP/$RELEASE_ID.tar.gz" \
            "$RUNNER_TEMP/$RELEASE_ID.sha256" \
            "$RUNNER_TEMP/$RELEASE_ID.env" \
            "$RUNNER_TEMP/health-response"

          echo "Temporary cleanup completed"

      # ======================================================
      # 10. Deployment notification and release tracking
      # ======================================================

      - name: Report deployment status
        if: always()

        env:
          NOTIFICATION_WEBHOOK: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK }}
          DEPLOY_STATUS: ${{ job.status }}

        run: |
          printf 'Release: `%s`\nResult: **%s**\n' \
            "$RELEASE_ID" "$DEPLOY_STATUS" \
            >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "${NOTIFICATION_WEBHOOK:-}" ]]; then

            curl -fsS \
              --max-time 10 \
              -H 'Content-Type: application/json' \
              --data "{\"release\":\"$RELEASE_ID\",\"status\":\"$DEPLOY_STATUS\"}" \
              "$NOTIFICATION_WEBHOOK" \
              || echo "::warning::Notification failed"

          fi
