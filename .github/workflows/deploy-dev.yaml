
name: Deploy Development

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SERVER_HOST: ${{ secrets.DEV_SERVER_HOST }}
      SERVER_USER: tthelendsyste
      SERVER_PORT: "22"

    steps:

      # Step 1: Configure SSH
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          echo "========== CONFIGURING SSH =========="

          test -n "$SERVER_HOST" || {
            echo "ERROR: DEV_SERVER_HOST is missing"
            exit 1
          }

          test -n "$SSH_PRIVATE_KEY" || {
            echo "ERROR: DEV_SERVER_SSH_KEY is missing"
            exit 1
          }

          test -n "$SSH_KNOWN_HOSTS" || {
            echo "ERROR: DEV_SERVER_KNOWN_HOSTS is missing"
            exit 1
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/deploy_key"

          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH configuration completed"

      # Step 2: Validate SSH Private Key
      - name: Validate SSH Private Key
        run: |
          set -euo pipefail

          echo "========== VALIDATING SSH KEY =========="

          ssh-keygen -y -P "" \
            -f "$HOME/.ssh/deploy_key" \
            > /dev/null || {
              echo "ERROR: Invalid or encrypted SSH key"
              exit 1
            }

          echo "SSH private key validation successful"

      # Step 3: Diagnose GitHub Runner Network
      - name: Diagnose SSH Network
        run: |
          set -euo pipefail

          echo "========== RUNNER INFORMATION =========="

          echo "GitHub runner public IPv4:"
          curl -4 -fsS --max-time 10 \
            https://api.ipify.org || true
          echo

          echo "========== SERVER DNS =========="

          echo "Resolving server IPv4 address..."

          getent ahostsv4 "$SERVER_HOST" || {
            echo "ERROR: Server DNS resolution failed"
            exit 1
          }

          echo "========== SSH PORT TEST =========="

          echo "Testing server port $SERVER_PORT..."

          if nc -4 -vz -w 20 \
            "$SERVER_HOST" "$SERVER_PORT"; then

            echo "SUCCESS: SSH port is reachable"

          else

            echo "ERROR: GitHub runner cannot reach server SSH port"

            echo "Possible causes:"
            echo "1. Server firewall blocking port 22"
            echo "2. GitHub runner IP blocked"
            echo "3. Incorrect SSH hostname/IP"
            echo "4. Hosting provider network restrictions"

            exit 1
          fi

      # Step 4: Test SSH Authentication
      - name: Test SSH Connection
        run: |
          set -euo pipefail

          echo "========== TESTING SSH =========="

          ssh \
            -4 \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" \
            'whoami && hostname'

          echo "SSH authentication successful"

      # Step 5: Verify Deployment Script
      - name: Verify Remote Deployment Script
        run: |
          set -euo pipefail

          echo "========== VERIFYING DEPLOY SCRIPT =========="

          ssh \
            -4 \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" \
            'test -f "$HOME/apps/my-project-dev/deploy-dev.sh" && echo "Deployment script found"'

      # Step 6: Run Deployment Script
      - name: Deploy Development Application
        run: |
          set -euo pipefail

          echo "========== STARTING DEPLOYMENT =========="

          ssh \
            -4 \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" \
            'bash "$HOME/apps/my-project-dev/deploy-dev.sh"'

          echo "Deployment script completed successfully"
