
name: Deploy Development

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lendsystem-development-deployment
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Build, Deploy and Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: development
      url: https://test.thelendsystem.com

    env:
      SERVER_HOST: ${{ secrets.DEV_SERVER_HOST }}
      SERVER_USER: ${{ secrets.DEV_SERVER_USER }}
      SERVER_PORT: ${{ secrets.DEV_SERVER_PORT }}
      DEPLOY_ROOT: ${{ secrets.DEV_DEPLOY_ROOT }}
      WEBSITE_URL: https://test.thelendsystem.com

    steps:
      # 1. Checkout exact commit
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 3. Install reproducible dependencies
      - name: Install Dependencies
        run: |
          set -euo pipefail
          npm ci

      # 4. Quality checks
      - name: Run Quality Checks
        run: |
          set -euo pipefail

          npm run lint --if-present
          npm run test --if-present

      # 5. Build application
      - name: Build Application
        run: |
          set -euo pipefail

          echo "Building commit: $GITHUB_SHA"

          npm run build

          test -s dist/index.html
          test -d dist/assets
          test -n "$(find dist/assets -type f -print -quit)"

          printf '%s\n' "$GITHUB_SHA" \
            > dist/deployment-version.txt

          echo "Build completed successfully"

      # 6. Configure secure SSH
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          for value in \
            "$SERVER_HOST" \
            "$SERVER_USER" \
            "$SERVER_PORT" \
            "$DEPLOY_ROOT" \
            "$SSH_PRIVATE_KEY" \
            "$SSH_KNOWN_HOSTS"; do
            test -n "$value"
          done

          [[ "$SERVER_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9_./-]+$ ]]
          [[ "$DEPLOY_ROOT" != "/" ]]
          [[ "$DEPLOY_ROOT" != */../* ]]
          [[ "$DEPLOY_ROOT" != */.. ]]
          [[ "$DEPLOY_ROOT" != */./* ]]
          [[ "$DEPLOY_ROOT" != */. ]]

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/deploy_key"

          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y -P "" \
            -f "$HOME/.ssh/deploy_key" \
            > /dev/null

          cat >> "$GITHUB_ENV" <<EOF
          GIT_SSH_COMMAND=ssh -4 -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20
          EOF

      # 7. Validate server and deployment structure
      - name: Server Preflight
        run: |
          set -euo pipefail

          ssh -4 \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" \
            bash -s -- "$DEPLOY_ROOT" <<'REMOTE'
          set -euo pipefail

          root="$1"

          test -d "$root"
          test -d "$root/releases"
          test -L "$root/current"

          target="$(readlink "$root/current")"
          test -n "$target"

          case "$target" in
            "$root/releases/"*) ;;
            *)
              echo "Invalid current release target"
              exit 1
              ;;
          esac

          test -f "$root/current/index.html"
          test -w "$root/releases"
          test -w "$root"

          echo "Server preflight successful"
          REMOTE

      # 8. Create unique release identifier
      - name: Prepare Release
        id: release
        run: |
          set -euo pipefail

          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Release: $RELEASE_ID"

      # 9. Create isolated release directory
      - name: Create Release Directory
        run: |
          set -euo pipefail

          ssh -4 \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            bash -s -- \
            "$DEPLOY_ROOT" \
            "${{ steps.release.outputs.id }}" <<'REMOTE'
          set -euo pipefail

          root="$1"
          release_id="$2"
          release="$root/releases/$release_id"

          if [ -e "$release" ] || [ -L "$release" ]; then
            echo "Release directory already exists"
            exit 1
          fi

          mkdir -- "$release"

          echo "Release directory created"
          REMOTE

      # 10. Upload build into isolated release
      - name: Upload Build
        run: |
          set -euo pipefail

          release="${{ steps.release.outputs.id }}"

          rsync -avz \
            --checksum \
            --delete \
            -e "$GIT_SSH_COMMAND" \
            dist/ \
            "$SERVER_USER@$SERVER_HOST:$DEPLOY_ROOT/releases/$release/"

          echo "Build uploaded"

      # 11. Verify all uploaded build files
      - name: Verify Uploaded Build
        run: |
          set -euo pipefail

          release="${{ steps.release.outputs.id }}"

          diff_output="$(
            rsync -rcn \
              --delete \
              --out-format='%n' \
              -e "$GIT_SSH_COMMAND" \
              dist/ \
              "$SERVER_USER@$SERVER_HOST:$DEPLOY_ROOT/releases/$release/"
          )"

          if [ -n "$diff_output" ]; then
            echo "ERROR: Uploaded build differs"
            echo "$diff_output"
            exit 1
          fi

          echo "Uploaded build verified"

      # 12. Atomically activate the release
      - name: Activate Release
        id: activate
        run: |
          set -euo pipefail

          ssh -4 \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            bash -s -- \
            "$DEPLOY_ROOT" \
            "${{ steps.release.outputs.id }}" <<'REMOTE'
          set -euo pipefail

          root="$1"
          release_id="$2"

          release="$root/releases/$release_id"

          test -s "$release/index.html"
          test -d "$release/assets"
          test -s "$release/deployment-version.txt"
          test -L "$root/current"

          old_release="$(readlink "$root/current")"

          case "$old_release" in
            "$root/releases/"*) ;;
            *)
              echo "Invalid previous release"
              exit 1
              ;;
          esac

          # Save previous release for rollback
          previous_tmp="$root/.previous-$release_id"

          ln -s -- "$old_release" "$previous_tmp"
          mv -Tf -- "$previous_tmp" "$root/previous"

          # Create new pointer, then switch atomically
          next="$root/.next-$release_id"

          ln -s -- "$release" "$next"
          mv -Tf -- "$next" "$root/current"

          echo "Release activated: $release_id"
          REMOTE

      # 13. Verify live deployment
      - name: Verify Live Website
        run: |
          set -euo pipefail

          echo "Verifying live deployment..."

          # Check deployment version, allowing for
          # short-lived web-server or CDN caching.
          verified=false

          for attempt in 1 2 3 4 5; do
            live_commit="$(
              curl -fLsS \
                --retry 2 \
                --max-time 20 \
                -H "Cache-Control: no-cache" \
                "$WEBSITE_URL/deployment-version.txt?sha=$GITHUB_SHA" \
                || true
            )"

            if [ "$live_commit" = "$GITHUB_SHA" ]; then
              verified=true
              break
            fi

            sleep 3
          done

          if [ "$verified" != "true" ]; then
            echo "ERROR: Live commit mismatch"
            exit 1
          fi

          # Compare actual live HTML with build
          curl -fLsS \
            --retry 3 \
            --max-time 20 \
            -H "Cache-Control: no-cache" \
            "$WEBSITE_URL/?sha=$GITHUB_SHA" \
            -o live-index.html

          if ! cmp -s dist/index.html live-index.html; then
            echo "ERROR: Live HTML differs from build"
            exit 1
          fi

          # Verify all files in the Vite assets directory
          while IFS= read -r -d '' file; do
            relative="${file#dist/}"

            curl -fLsS \
              --retry 3 \
              --max-time 20 \
              -H "Cache-Control: no-cache" \
              "$WEBSITE_URL/$relative?sha=$GITHUB_SHA" \
              -o live-asset.tmp

            if ! cmp -s "$file" live-asset.tmp; then
              echo "ERROR: Asset mismatch: $relative"
              exit 1
            fi

          done < <(find dist/assets -type f -print0)

          echo "Live HTML and assets verified"
          echo "Deployment commit: $GITHUB_SHA"

      # 14. Automatically rollback if verification fails
      - name: Rollback Failed Deployment
        if: ${{ failure() && steps.activate.outcome == 'success' }}
        run: |
          set -euo pipefail

          echo "Live verification failed. Rolling back..."

          ssh -4 \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            bash -s -- "$DEPLOY_ROOT" <<'REMOTE'
          set -euo pipefail

          root="$1"

          test -L "$root/previous"
          test -L "$root/current"

          previous="$(readlink "$root/previous")"

          case "$previous" in
            "$root/releases/"*) ;;
            *)
              echo "Unsafe rollback target"
              exit 1
              ;;
          esac

          test -s "$previous/index.html"

          rollback_link="$root/.rollback-$$"

          ln -s -- "$previous" "$rollback_link"
          mv -Tf -- "$rollback_link" "$root/current"

          echo "Previous release restored"
          REMOTE

      # 15. Write deployment report
      - name: Deployment Summary
        if: success()
        run: |
          {
            echo "## Development Deployment Successful"
            echo ""
            echo "- Website: $WEBSITE_URL"
            echo "- Branch: main"
            echo "- Commit: $GITHUB_SHA"
            echo "- Release: ${{ steps.release.outputs.id }}"
            echo "- Framework: React + Vite"
            echo "- Deployment: Atomic symlink activation"
            echo "- Verification: Passed"
            echo "- Rollback: Previous release retained"
          } >> "$GITHUB_STEP_SUMMARY"
