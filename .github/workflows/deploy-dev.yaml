
name: Universal CI/CD Deployment

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Laravel to cPanel
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    env:
      LOCAL_ENV_PATH: ${{ vars.LOCAL_ENV_PATH || '/Users/archirastogi/Documents/GitHub/test/.env' }}
      REMOTE_DEPLOY_DIR: ${{ vars.REMOTE_DEPLOY_DIR || 'backend-api' }}
      REMOTE_WEB_ROOT: ${{ vars.REMOTE_WEB_ROOT || 'public_html' }}
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://test.thelendsystem.com' }}

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      # 2. Validate
      - name: Validate deployment configuration
        run: |
          set -euo pipefail

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

          test -s "$LOCAL_ENV_PATH" || {
            echo "::error::Local .env missing or empty"
            exit 1
          }

          test -r "$LOCAL_ENV_PATH"
          test -f scripts/deploy.sh

          bash -n scripts/deploy.sh

          if git ls-files --error-unmatch .env \
            >/dev/null 2>&1; then
            echo "::error::.env must not be committed"
            exit 1
          fi

          for dir in "$REMOTE_DEPLOY_DIR" "$REMOTE_WEB_ROOT"; do
            if [[ ! "$dir" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "::error::Invalid directory: $dir"
              exit 1
            fi
          done

          echo "Configuration validated"

      # 3. Configure SSH
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.DEV_SERVER_HOST }}
          SSH_USER: ${{ secrets.DEV_SERVER_USER }}
          SSH_PORT: ${{ secrets.DEV_SERVER_PORT }}
          SSH_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077

          : "${SSH_HOST:?SSH host missing}"
          : "${SSH_USER:?SSH user missing}"
          : "${SSH_KEY:?SSH key missing}"
          : "${KNOWN_HOSTS:?Known hosts missing}"

          SSH_DIR="$RUNNER_TEMP/deploy-ssh"
          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"

          printf '%s\n' "$SSH_KEY" > "$SSH_DIR/id_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$SSH_DIR/known_hosts"

          chmod 600 "$SSH_DIR/id_deploy"
          chmod 600 "$SSH_DIR/known_hosts"

          {
            echo "Host cpanel-deploy"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port ${SSH_PORT:-22}"
            echo "  IdentityFile $SSH_DIR/id_deploy"
            echo "  UserKnownHostsFile $SSH_DIR/known_hosts"
            echo "  StrictHostKeyChecking yes"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 15"
            echo "  ServerAliveInterval 30"
            echo "  ServerAliveCountMax 5"
          } > "$SSH_DIR/config"

          chmod 600 "$SSH_DIR/config"

      # 4. Verify SSH connection
      - name: Test SSH connection
        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            'echo "SSH connection successful"'

      # 5. Package source
      - name: Package application
        run: |
          set -euo pipefail

          git archive --format=tar HEAD \
            | gzip > "$RUNNER_TEMP/app-release.tar.gz"

          test -s "$RUNNER_TEMP/app-release.tar.gz"

          echo "Application archive created"

      # 6. Prepare remote directory
      - name: Prepare remote directory
        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            "mkdir -p \"\$HOME/$REMOTE_DEPLOY_DIR\""

      # 7. Upload source
      - name: Upload source code
        run: |
          set -euo pipefail

          scp -q \
            -F "$RUNNER_TEMP/deploy-ssh/config" \
            "$RUNNER_TEMP/app-release.tar.gz" \
            "cpanel-deploy:$REMOTE_DEPLOY_DIR/.release-upload.tar.gz"

      # 8. Upload environment
      - name: Upload environment
        run: |
          set -euo pipefail

          scp -q \
            -F "$RUNNER_TEMP/deploy-ssh/config" \
            "$LOCAL_ENV_PATH" \
            "cpanel-deploy:$REMOTE_DEPLOY_DIR/.env.upload"

      # 9. Execute deployment
      - name: Deploy Laravel application
        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            "bash -se -- '$REMOTE_DEPLOY_DIR' '$REMOTE_WEB_ROOT'" <<'REMOTE'
          set -euo pipefail
          umask 077

          DEPLOY_DIR="$1"
          export REMOTE_WEB_ROOT="$2"

          cd "$HOME/$DEPLOY_DIR"

          test -s .release-upload.tar.gz
          test -s .env.upload

          # Validate archive paths before extraction.
          python3 - <<'PY'
          import tarfile
          from pathlib import PurePosixPath

          with tarfile.open(".release-upload.tar.gz", "r:gz") as archive:
              for member in archive:
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or not (member.isfile() or member.isdir())
                  ):
                      raise SystemExit(
                          "Unsafe archive entry: " + member.name
                      )
          PY

          tar -xzf .release-upload.tar.gz \
            --no-same-owner

          chmod 600 .env.upload
          mv -f .env.upload .env
          chmod 600 .env

          bash -n scripts/deploy.sh
          bash scripts/deploy.sh

          rm -f .release-upload.tar.gz

          echo "Server deployment completed"
          REMOTE

      # 10. Public API verification
      - name: Verify public API
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || '' }}
        run: |
          set -euo pipefail

          if [ -n "$HEALTH_URL" ]; then
            URL="$HEALTH_URL"
          else
            URL="${API_BASE_URL%/}/api/health"
          fi

          echo "Checking deployed API health endpoint"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            --retry 3 \
            --retry-delay 3 \
            --output "$RUNNER_TEMP/health-response.txt" \
            --write-out '%{http_code}' \
            -H 'Accept: application/json' \
            "$URL") || {
              echo "::error::Cannot connect to API"
              exit 1
            }

          echo "HTTP status: $HTTP_CODE"
          cat "$RUNNER_TEMP/health-response.txt"
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::API health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi

          echo "API health check passed"

      # 11. Diagnose failures
      - name: Diagnose deployment failure
        if: failure()
        run: |
          set -uo pipefail

          SSH_CONFIG="$RUNNER_TEMP/deploy-ssh/config"

          if [ ! -f "$SSH_CONFIG" ]; then
            echo "SSH not configured; skipping server diagnostics"
            exit 0
          fi

          ssh -F "$SSH_CONFIG" cpanel-deploy \
            "bash -se -- '$REMOTE_DEPLOY_DIR' '$REMOTE_WEB_ROOT'" <<'REMOTE' || true
          set -u

          cd "$HOME/$1" || exit 0
          WEB_ROOT="$HOME/$2"

          PHP_BIN="/opt/cpanel/ea-php84/root/usr/bin/php"

          echo "=== Laravel routes ==="
          "$PHP_BIN" artisan route:list --path=api/health || true
          "$PHP_BIN" artisan route:list --path=api/v1/auth || true

          echo "=== Published files ==="
          ls -la "$WEB_ROOT/index.php" "$WEB_ROOT/.htaccess" || true

          echo "=== Error handler locations ==="
          grep -RnF \
            "The requested endpoint does not exist" \
            bootstrap app routes Modules \
            2>/dev/null || true

          echo "=== Recent Laravel log ==="
          if [ -f storage/logs/laravel.log ]; then
            tail -n 60 storage/logs/laravel.log || true
          fi
          REMOTE

      # 12. Cleanup
      - name: Cleanup temporary files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/deploy-ssh"
          rm -f "$RUNNER_TEMP/app-release.tar.gz"
          rm -f "$RUNNER_TEMP/health-response.txt"
