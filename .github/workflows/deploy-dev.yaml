
name: Deploy Development

on:
  workflow_dispatch:
    inputs:
      run_initial_seeders:
        description: 'Run initial user database seeder'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Application to cPanel
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    env:
      LOCAL_ENV_PATH: ${{ vars.LOCAL_ENV_PATH || '/Users/archirastogi/Documents/GitHub/test/.env' }}
      REMOTE_DEPLOY_DIR: ${{ vars.REMOTE_DEPLOY_DIR || 'backend-api' }}
      RUN_INITIAL_SEEDERS: ${{ inputs.run_initial_seeders || 'false' }}

    steps:

      # ====================================
      # 1. Checkout source code
      # ====================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      # ====================================
      # 2. Debug deployment configuration
      # ====================================
      - name: Debug deployment configuration
        run: |
          set -euo pipefail

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

          if [ -n "${LOCAL_ENV_PATH:-}" ]; then
            echo "LOCAL_ENV_PATH: CONFIGURED"
          else
            echo "::error::LOCAL_ENV_PATH: EMPTY"
            exit 1
          fi

          if [ -n "${REMOTE_DEPLOY_DIR:-}" ]; then
            echo "REMOTE_DEPLOY_DIR: CONFIGURED"
          else
            echo "::error::REMOTE_DEPLOY_DIR: EMPTY"
            exit 1
          fi

          if [ -s "$LOCAL_ENV_PATH" ]; then
            echo "Local .env: FOUND"
          else
            echo "::error::Local .env: NOT FOUND"
            exit 1
          fi

      # ====================================
      # 3. Validate deployment configuration
      # ====================================
      - name: Validate configuration
        run: |
          set -euo pipefail

          echo "Validating deployment configuration"

          : "${LOCAL_ENV_PATH:?LOCAL_ENV_PATH is missing}"
          : "${REMOTE_DEPLOY_DIR:?REMOTE_DEPLOY_DIR is missing}"

          if [ ! -s "$LOCAL_ENV_PATH" ]; then
            echo "::error::Local .env missing or empty"
            exit 1
          fi

          if [ ! -r "$LOCAL_ENV_PATH" ]; then
            echo "::error::Cannot read local .env"
            exit 1
          fi

          if [ ! -f scripts/deploy.sh ]; then
            echo "::error::scripts/deploy.sh is missing"
            exit 1
          fi

          bash -n scripts/deploy.sh

          if git ls-files --error-unmatch .env \
              >/dev/null 2>&1; then
            echo "::error::.env must not be tracked in Git"
            exit 1
          fi

          if [[ ! "$REMOTE_DEPLOY_DIR" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Invalid remote deployment directory"
            exit 1
          fi

          echo "Configuration validated successfully"

      # ====================================
      # 4. Configure secure SSH
      # ====================================
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.DEV_SERVER_HOST }}
          SSH_USER: ${{ secrets.DEV_SERVER_USER }}
          SSH_PORT: ${{ secrets.DEV_SERVER_PORT }}
          SSH_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077

          : "${SSH_HOST:?SSH host missing}"
          : "${SSH_USER:?SSH username missing}"
          : "${SSH_KEY:?SSH private key missing}"
          : "${KNOWN_HOSTS:?SSH known hosts missing}"

          SSH_DIR="$RUNNER_TEMP/deploy-ssh"

          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"

          printf '%s\n' "$SSH_KEY" > "$SSH_DIR/id_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$SSH_DIR/known_hosts"

          chmod 600 "$SSH_DIR/id_deploy"
          chmod 600 "$SSH_DIR/known_hosts"

          {
            echo "Host cpanel-deploy"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port ${SSH_PORT:-22}"
            echo "  IdentityFile $SSH_DIR/id_deploy"
            echo "  UserKnownHostsFile $SSH_DIR/known_hosts"
            echo "  StrictHostKeyChecking yes"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 15"
            echo "  ServerAliveInterval 30"
            echo "  ServerAliveCountMax 5"
          } > "$SSH_DIR/config"

          chmod 600 "$SSH_DIR/config"

          echo "SSH configured successfully"

      # ====================================
      # 5. Test SSH connection
      # ====================================
      
      - name: Test SSH connection
        run: |
          set -euo pipefail

          echo "Testing SSH connectivity"

          ssh -v \
            -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            'echo "SSH connection successful"'


      # ====================================
      # 6. Package application source
      # ====================================
      - name: Package source code
        run: |
          set -euo pipefail

          echo "Creating source archive"

          git archive --format=tar HEAD \
            | gzip > "$RUNNER_TEMP/app-release.tar.gz"

          test -s "$RUNNER_TEMP/app-release.tar.gz"

          echo "Source archive created"

      # ====================================
      # 7. Prepare remote directory
      # ====================================
      - name: Prepare server directory
        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            "mkdir -p \"\$HOME/$REMOTE_DEPLOY_DIR\""

          echo "Server directory ready"

      # ====================================
      # 8. Upload application source
      # ====================================
      - name: Upload application
        run: |
          set -euo pipefail

          echo "Uploading application source"

          scp -q \
            -F "$RUNNER_TEMP/deploy-ssh/config" \
            "$RUNNER_TEMP/app-release.tar.gz" \
            "cpanel-deploy:$REMOTE_DEPLOY_DIR/.release-upload.tar.gz"

          echo "Source uploaded successfully"

      # ====================================
      # 9. Upload local environment
      # ====================================
      - name: Upload local .env
        run: |
          set -euo pipefail

          echo "Uploading local .env"

          scp -q \
            -F "$RUNNER_TEMP/deploy-ssh/config" \
            "$LOCAL_ENV_PATH" \
            "cpanel-deploy:$REMOTE_DEPLOY_DIR/.env.upload"

          echo ".env uploaded successfully"

      # ====================================
      # 10. Execute project deployment
      # ====================================
      
      
      # ====================================
      # 10. Execute project deployment
      # ====================================
      - name: Deploy application
        env:
          RUN_INITIAL_SEEDERS: ${{ inputs.run_initial_seeders || 'false' }}
        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            "bash -se -- '$REMOTE_DEPLOY_DIR' '$RUN_INITIAL_SEEDERS'" <<'REMOTE'
          set -euo pipefail
          umask 077

          DEPLOY_DIR="$1"
          RUN_INITIAL_SEEDERS="$2"

          cd "$HOME/$DEPLOY_DIR"

          echo "STEP 1: Checking uploaded files"
          test -s .release-upload.tar.gz
          test -s .env.upload

          echo "STEP 2: Extracting application"
          tar -xzf .release-upload.tar.gz

          echo "STEP 3: Installing environment"
          chmod 600 .env.upload
          mv -f .env.upload .env
          chmod 600 .env

          echo "STEP 4: Checking deployment script"
          test -f scripts/deploy.sh
          bash -n scripts/deploy.sh

          echo "STEP 5: Running Laravel deployment"
          export RUN_INITIAL_SEEDERS

          bash scripts/deploy.sh

          echo "STEP 6: Cleanup"
          rm -f .release-upload.tar.gz

          echo "Application deployment successful"
          REMOTE



      # ====================================
      # 11. Cleanup local temporary files
      # ====================================
      - name: Cleanup temporary files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/deploy-ssh"
          rm -f "$RUNNER_TEMP/app-release.tar.gz"
        
        