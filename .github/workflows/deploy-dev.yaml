
name: Universal CI/CD Deployment

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Application to cPanel
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      LOCAL_ENV_PATH: ${{ vars.LOCAL_ENV_PATH }}
      REMOTE_DEPLOY_DIR: ${{ vars.REMOTE_DEPLOY_DIR }}

    steps:
      # ====================================
      # 1. Checkout source code
      # ====================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      # ====================================
      # 2. Validate deployment configuration
      # ====================================
      - name: Validate configuration
        run: |
          set -euo pipefail

          echo "Validating deployment configuration"

          : "${LOCAL_ENV_PATH:?LOCAL_ENV_PATH is missing}"
          : "${REMOTE_DEPLOY_DIR:?REMOTE_DEPLOY_DIR is missing}"

          if [ ! -s "$LOCAL_ENV_PATH" ]; then
            echo "::error::Local .env missing or empty"
            exit 1
          fi

          if [ ! -r "$LOCAL_ENV_PATH" ]; then
            echo "::error::Cannot read local .env"
            exit 1
          fi

          if [ ! -f scripts/deploy.sh ]; then
            echo "::error::scripts/deploy.sh missing"
            exit 1
          fi

          if git ls-files --error-unmatch .env \
              >/dev/null 2>&1; then
            echo "::error::.env is tracked in Git"
            exit 1
          fi

          # Allow only a single safe directory name
          if [[ ! "$REMOTE_DEPLOY_DIR" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Invalid deployment directory"
            exit 1
          fi

          echo "Configuration validated successfully"

      # ====================================
      # 3. Configure SSH
      # ====================================
      - name: Configure secure SSH
        env:
          SSH_HOST: ${{ secrets.DEV_SERVER_HOST }}
          SSH_USER: ${{ secrets.DEV_SERVER_USER }}
          SSH_PORT: ${{ secrets.DEV_SERVER_PORT }}
          SSH_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          echo "Configuring SSH"

          : "${SSH_HOST:?SSH host missing}"
          : "${SSH_USER:?SSH username missing}"
          : "${SSH_KEY:?SSH key missing}"
          : "${KNOWN_HOSTS:?Known hosts missing}"

          SSH_DIR="$RUNNER_TEMP/deploy-ssh"

          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"

          printf '%s\n' "$SSH_KEY" \
            > "$SSH_DIR/id_deploy"

          printf '%s\n' "$KNOWN_HOSTS" \
            > "$SSH_DIR/known_hosts"

          chmod 600 "$SSH_DIR/id_deploy"
          chmod 600 "$SSH_DIR/known_hosts"

          {
            echo "Host cpanel-deploy"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port ${SSH_PORT:-22}"
            echo "  IdentityFile $SSH_DIR/id_deploy"
            echo "  UserKnownHostsFile $SSH_DIR/known_hosts"
            echo "  StrictHostKeyChecking yes"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 15"
          } > "$SSH_DIR/config"

          chmod 600 "$SSH_DIR/config"

          echo "SSH configuration completed"

      # ====================================
      # 4. Test SSH connection
      # ====================================
      - name: Test server connection
        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            'echo "SSH connection successful"'

      # ====================================
      # 5. Package application
      # ====================================
      - name: Package source code
        run: |
          set -euo pipefail

          echo "Packaging application"

          git archive --format=tar HEAD \
            | gzip > "$RUNNER_TEMP/app-release.tar.gz"

          test -s "$RUNNER_TEMP/app-release.tar.gz"

          echo "Application package created"

      # ====================================
      # 6. Prepare deployment directory
      # ====================================
      - name: Prepare server directory
        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            "mkdir -p \"\$HOME/$REMOTE_DEPLOY_DIR\""

          echo "Server directory ready"

      # ====================================
      # 7. Upload application source
      # ====================================
      - name: Upload application
        run: |
          set -euo pipefail

          echo "Uploading application source"

          scp -q \
            -F "$RUNNER_TEMP/deploy-ssh/config" \
            "$RUNNER_TEMP/app-release.tar.gz" \
            "cpanel-deploy:$REMOTE_DEPLOY_DIR/.release-upload.tar.gz"

          echo "Application uploaded"

      # ====================================
      # 8. Upload local .env
      # ====================================
      - name: Upload environment
        run: |
          set -euo pipefail

          echo "Uploading local environment"

          scp -q \
            -F "$RUNNER_TEMP/deploy-ssh/config" \
            "$LOCAL_ENV_PATH" \
            "cpanel-deploy:$REMOTE_DEPLOY_DIR/.env.upload"

          echo "Environment uploaded successfully"

      # ====================================
      # 9. Execute remote deployment
      # ====================================
      - name: Deploy application
        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/deploy-ssh/config" \
            cpanel-deploy \
            "bash -se -- '$REMOTE_DEPLOY_DIR'" <<'REMOTE'

          set -euo pipefail
          umask 077

          DEPLOY_DIR="$1"
          cd "$HOME/$DEPLOY_DIR"

          echo "=================================="
          echo "Starting application deployment"
          echo "=================================="

          # Validate uploaded files
          test -s .release-upload.tar.gz
          test -s .env.upload

          # Extract application
          echo "Extracting source files"
          tar -xzf .release-upload.tar.gz

          # Configure environment
          echo "Configuring environment"
          chmod 600 .env.upload
          mv -f .env.upload .env
          chmod 600 .env

          # Execute framework-specific script
          if [ ! -f scripts/deploy.sh ]; then
            echo "ERROR: Deployment script missing"
            exit 1
          fi

          echo "Executing deployment script"

          bash scripts/deploy.sh

          echo "Framework deployment completed"

          # Cleanup uploaded archive
          rm -f .release-upload.tar.gz

          echo "=================================="
          echo "Deployment successful"
          echo "=================================="

          REMOTE

      # ====================================
      # 10. Cleanup temporary files
      # ====================================
      - name: Cleanup temporary files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/deploy-ssh"
          rm -f "$RUNNER_TEMP/app-release.tar.gz"
          
