
name: Deploy Laravel Development

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Laravel to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      DEPLOY_PATH: backend-api

    steps:
      # ====================================
      # 1. Checkout staging branch
      # ====================================
      - name: Checkout Laravel project
        uses: actions/checkout@v4
        with:
          ref: staging
          persist-credentials: false

      # ====================================
      # 2. Verify local .env
      # ====================================
      - name: Validate local .env
        run: |
          set -euo pipefail

          # CHANGE THIS TO YOUR LOCAL PROJECT PATH
          LOCAL_PROJECT="/Users/YOUR_USERNAME/path/to/test"
          LOCAL_ENV="$LOCAL_PROJECT/.env"

          echo "Checking local environment"

          if [ ! -s "$LOCAL_ENV" ]; then
            echo "::error::Local .env missing or empty"
            exit 1
          fi

          if [ ! -r "$LOCAL_ENV" ]; then
            echo "::error::Cannot read local .env"
            exit 1
          fi

          if git ls-files --error-unmatch .env \
              >/dev/null 2>&1; then
            echo "::error::.env is tracked in Git"
            exit 1
          fi

          echo "LOCAL_ENV=$LOCAL_ENV" >> "$GITHUB_ENV"

          echo "Local .env verified"

      # ====================================
      # 3. Configure secure SSH
      # ====================================
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.DEV_SERVER_HOST }}
          SSH_USER: ${{ secrets.DEV_SERVER_USER }}
          SSH_PORT: ${{ secrets.DEV_SERVER_PORT }}
          SSH_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.DEV_SERVER_HOST_KEY }}
        run: |
          set -euo pipefail

          SSH_DIR="$RUNNER_TEMP/laravel-ssh"
          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"

          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST_KEY" ]; then
            echo "::error::SSH key or host verification missing"
            exit 1
          fi

          printf '%s\n' "$SSH_KEY" > "$SSH_DIR/id_deploy"
          printf '%s\n' "$SSH_HOST_KEY" > "$SSH_DIR/known_hosts"

          chmod 600 "$SSH_DIR/id_deploy"
          chmod 600 "$SSH_DIR/known_hosts"

          {
            echo "Host cpanel-deploy"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port ${SSH_PORT:-22}"
            echo "  IdentityFile $SSH_DIR/id_deploy"
            echo "  UserKnownHostsFile $SSH_DIR/known_hosts"
            echo "  StrictHostKeyChecking yes"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
          } > "$SSH_DIR/config"

          chmod 600 "$SSH_DIR/config"

          echo "SSH configured"

      # ====================================
      # 4. Verify server connection
      # ====================================
      - name: Test SSH connection
        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/laravel-ssh/config" \
            cpanel-deploy \
            'echo "Connected to cPanel server"'

      # ====================================
      # 5. Package source code
      # ====================================
      - name: Package Laravel source
        run: |
          set -euo pipefail

          echo "Creating deployment archive"

          git archive --format=tar HEAD \
            | gzip > "$RUNNER_TEMP/laravel-release.tar.gz"

          test -s "$RUNNER_TEMP/laravel-release.tar.gz"

          echo "Source archive created"

      # ====================================
      # 6. Prepare server directories
      # ====================================
      - name: Prepare cPanel directories
        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/laravel-ssh/config" \
            cpanel-deploy 'sh -se' <<'REMOTE'
          set -eu
          umask 077

          mkdir -p "$HOME/backend-api"
          mkdir -p "$HOME/backend-api/storage"
          mkdir -p "$HOME/backend-api/bootstrap/cache"

          echo "Server directories ready"
          REMOTE

      # ====================================
      # 7. Upload Laravel source code
      # ====================================
      - name: Upload source to cPanel
        run: |
          set -euo pipefail

          scp -q \
            -F "$RUNNER_TEMP/laravel-ssh/config" \
            "$RUNNER_TEMP/laravel-release.tar.gz" \
            "cpanel-deploy:backend-api/.release-upload.tar.gz"

          echo "Source uploaded successfully"

      # ====================================
      # 8. Upload local .env
      # ====================================
      - name: Upload local environment
        run: |
          set -euo pipefail

          echo "Synchronizing local .env to cPanel"

          scp -q \
            -F "$RUNNER_TEMP/laravel-ssh/config" \
            "$LOCAL_ENV" \
            "cpanel-deploy:backend-api/.env.upload"

          echo ".env transferred securely"

      # ====================================
      # 9. Deploy and configure Laravel
      # ====================================
      - name: Deploy Laravel application
        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/laravel-ssh/config" \
            cpanel-deploy 'bash -se' <<'REMOTE'

          set -euo pipefail
          umask 077

          export PATH="/opt/cpanel/ea-php84/root/usr/bin:$HOME/.local/bin:$PATH"

          DEPLOY_PATH="$HOME/backend-api"
          cd "$DEPLOY_PATH"

          echo "=================================="
          echo "Starting Laravel deployment"
          echo "=================================="

          # -------------------------------
          # 1. Validate uploaded files
          # -------------------------------
          test -s .release-upload.tar.gz
          test -s .env.upload

          # -------------------------------
          # 2. Extract new code
          # -------------------------------
          echo "Extracting Laravel source"

          tar -xzf .release-upload.tar.gz

          test -f artisan
          test -f composer.json

          # -------------------------------
          # 3. Configure environment
          # -------------------------------
          echo "Configuring Laravel .env"

          chmod 600 .env.upload
          mv -f .env.upload .env
          chmod 600 .env

          # -------------------------------
          # 4. Check PHP and Composer
          # -------------------------------
          echo "Checking PHP"
          php -v

          echo "Checking Composer"
          composer --version

          # -------------------------------
          # 5. Prepare Laravel directories
          # -------------------------------
          echo "Preparing storage directories"

          mkdir -p \
            storage/app/public \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/views \
            storage/logs \
            bootstrap/cache

          chmod -R u+rwX storage bootstrap/cache

          # -------------------------------
          # 6. Install Composer packages
          # -------------------------------
          echo "Installing dependencies"

          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader

          # -------------------------------
          # 7. Clear configuration cache
          # -------------------------------
          echo "Clearing configuration"

          php artisan config:clear

          # -------------------------------
          # 8. Run migrations
          # -------------------------------
          echo "Running database migrations"

          php artisan migrate \
            --force \
            --no-interaction

          # -------------------------------
          # 9. Link public storage
          # -------------------------------
          echo "Linking storage"

          php artisan storage:link

          # -------------------------------
          # 10. Optimize Laravel
          # -------------------------------
          echo "Optimizing application"

          php artisan config:cache
          php artisan view:cache

          # -------------------------------
          # 11. Verify deployment
          # -------------------------------
          echo "Verifying application"

          php artisan --version
          php artisan migrate:status

          # -------------------------------
          # 12. Cleanup uploaded archive
          # -------------------------------
          rm -f .release-upload.tar.gz

          echo "=================================="
          echo "Laravel deployment successful"
          echo "=================================="

          REMOTE

      # ====================================
      # 10. Clean local temporary files
      # ====================================
      - name: Cleanup deployment files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/laravel-ssh"
          rm -f "$RUNNER_TEMP/laravel-release.tar.gz"
