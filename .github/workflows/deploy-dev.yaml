
name: Deploy Laravel Development

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Development Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.DEV_SERVER_PORT }}
          envs: REPO_URL
          command_timeout: 10m
          script: |
            set -e

            export PATH="/opt/cpanel/ea-php84/root/usr/bin:$HOME/.local/bin:$PATH"

            echo "Connected to server"
            whoami

            DEPLOY_PATH="$HOME/backend-api"

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            echo "Deploying to $DEPLOY_PATH"

            if [ ! -d .git ]; then
              if [ -n "$(ls -A)" ]; then
                echo "ERROR: Directory is not empty"
                exit 1
              fi

              echo "Cloning repository"
              git clone --branch staging \
                --single-branch "$REPO_URL" .
            else
              echo "Updating repository"
              git fetch origin staging
              git reset --hard origin/staging
            fi

            test -f artisan || {
              echo "ERROR: Laravel project not found"
              exit 1
            }

            test -f .env || {
              echo "ERROR: .env file missing"
              echo "Please configure .env on server"
              exit 1
            }

            echo "Checking PHP"
            php -v

            echo "Installing dependencies"
            composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --optimize-autoloader

            echo "Optimizing Laravel"
            php artisan config:clear
            php artisan config:cache

            echo "Development deployment successful"
