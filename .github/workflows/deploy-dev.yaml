
name: Deploy Laravel Development

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git

        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.DEV_SERVER_PORT }}
          envs: REPO_URL
          command_timeout: 15m

          script: |
            set -eu

            export PATH="/opt/cpanel/ea-php84/root/usr/bin:$HOME/.local/bin:$PATH"

            DEPLOY_PATH="$HOME/backend-api"

            echo "===================================="
            echo "Starting Laravel deployment"
            echo "===================================="

            echo "Connected to server"
            whoami

            # --------------------------------
            # 1. Prepare directory
            # --------------------------------

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            echo "Deployment path: $DEPLOY_PATH"

            # --------------------------------
            # 2. Clone or update repository
            # --------------------------------

            if [ ! -d .git ]; then

              echo "First-time deployment"

              # Clone into a temporary directory to
              # preserve existing server-side files.

              TEMP_REPO=$(mktemp -d "$HOME/laravel-clone.XXXXXX")

              git clone \
                --branch staging \
                --single-branch \
                "$REPO_URL" \
                "$TEMP_REPO"

              # Refuse to overwrite pre-existing files
              # other than the server-side .env.

              if [ -n "$(find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 ! -name .env -print -quit)" ]; then
                echo "ERROR: Deployment directory contains other files"
                rm -rf "$TEMP_REPO"
                exit 1
              fi

              cp -R "$TEMP_REPO/." "$DEPLOY_PATH/"
              rm -rf "$TEMP_REPO"

            else

              echo "Updating staging branch"

              git fetch origin staging
              git reset --hard origin/staging

            fi

            # --------------------------------
            # 3. Verify Laravel application
            # --------------------------------

            if [ ! -f artisan ]; then
              echo "ERROR: Laravel artisan missing"
              exit 1
            fi

            if [ ! -f composer.json ]; then
              echo "ERROR: composer.json missing"
              exit 1
            fi

            # --------------------------------
            # 4. Verify persistent .env
            # --------------------------------

            echo "Checking Laravel environment"

            if git ls-files --error-unmatch .env >/dev/null 2>&1; then
              echo "ERROR: .env must not be tracked in Git"
              exit 1
            fi

            if [ ! -s .env ]; then
              echo "ERROR: .env missing on cPanel"
              echo "Upload your local .env to:"
              echo "$DEPLOY_PATH/.env"
              exit 1
            fi

            chmod 600 .env

            echo "Laravel .env verified"

            # --------------------------------
            # 5. Check PHP and Composer
            # --------------------------------

            echo "Checking PHP"
            php -v

            echo "Checking Composer"
            composer --version

            # --------------------------------
            # 6. Prepare writable directories
            # --------------------------------

            echo "Preparing Laravel directories"

            mkdir -p \
              storage/app/public \
              storage/framework/cache/data \
              storage/framework/sessions \
              storage/framework/views \
              storage/logs \
              bootstrap/cache

            chmod -R u+rwX storage bootstrap/cache

            # --------------------------------
            # 7. Install dependencies
            # --------------------------------

            echo "Installing Composer dependencies"

            composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --no-progress \
              --optimize-autoloader

            # --------------------------------
            # 8. Clear old configuration
            # --------------------------------

            echo "Clearing Laravel configuration"

            php artisan config:clear

            # --------------------------------
            # 9. Run migrations
            # --------------------------------

            echo "Running database migrations"

            php artisan migrate \
              --force \
              --no-interaction

            # --------------------------------
            # 10. Link public storage
            # --------------------------------

            echo "Creating storage link"

            php artisan storage:link

            # --------------------------------
            # 11. Optimize Laravel
            # --------------------------------

            echo "Optimizing application"

            php artisan config:cache
            php artisan view:cache

            # --------------------------------
            # 12. Restart queue workers
            # --------------------------------

            echo "Restarting Laravel queues"

            php artisan queue:restart

            # --------------------------------
            # 13. Verify deployment
            # --------------------------------

            echo "Checking Laravel application"

            php artisan --version

            echo "===================================="
            echo "Laravel deployment successful"
            echo "===================================="
